@if (isOpen) {
<div class="dialog-backdrop" role="presentation" (click)="close()">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="forgot-password-title"
        (click)="$event.stopPropagation()">
        <div class="dialog__header">
            <button type="button" class="dialog__close" (click)="close()" aria-label="Close dialog">×</button>
        </div>

        @if (!isSubmitted()) {
        <h2 id="forgot-password-title">Forgot password?</h2>
        <p class="dialog__copy">Enter the email address associated with your account and we’ll send a password reset
            link.</p>
        <form class="dialog__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            <label class="dialog__field" for="forgot-password-email">
                <span>Email address</span>
                <input id="forgot-password-email" formControlName="email" type="email" autocomplete="email"
                    placeholder="you@example.com"
                    [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" />
                @if (form.controls.email.touched && form.controls.email.invalid) {
                <small class="dialog__error">Enter a valid email address.</small>
                }
            </label>
            <div class="dialog__actions">
                <button type="button" class="dialog__secondary" (click)="close()">Cancel</button>
                <button class="dialog__submit" type="submit" [disabled]="form.invalid || isSubmitting()">
                    @if (isSubmitting()) {
                    <span class="dialog__spinner" aria-hidden="true"></span>
                    }
                    <span>{{ isSubmitting() ? 'Sending...' : 'Send Reset Link' }}</span>
                </button>
            </div>
        </form>
        } @else {
        <h2 id="forgot-password-title">Forgot password?</h2>
        <p class="dialog__copy">If an account exists for this email address, a password reset link will be sent. Please
            check your inbox.</p>
        <button class="dialog__submit dialog__submit--full" type="button" (click)="close()">Close</button>
        }
    </div>
</div>
}
