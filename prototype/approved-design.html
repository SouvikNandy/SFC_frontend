<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuantSFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8FAF7;
    --panel:#FFFFFF;
    --panel-2:#FFFFFF;
    --border:#DDE7D8;
    --input-border:#C9D8C0;
    --panel-alt:#EAF4E4;
    --head-bg:#F1F7EC;
    --ink:#2B2B2B;
    --ink-soft:#3A4434;
    --muted:#5C6B55;
    --muted-2:#8B9884;
    --teal:#178A4C;
    --teal-dark:#12703C;
    --teal-tint:rgba(23,138,76,0.10);
    --teal-glow:rgba(23,138,76,0.14);
    --red:#C0342A;
    --red-tint:rgba(192,52,42,0.10);
    --accent:#7FA76A;
    --accent-dark:#6E9759;
    --accent-tint:rgba(127,167,106,0.12);
    --accent-ink:#FFFFFF;
    --hero-bg:#2E4D12;
    --hero-text:#F5F8F2;
    --hero-muted:#C7DBB9;
    --hero-stat-muted:#8FAE7C;
    --green-dot:#178A4C;
    --radius:14px;
    --font-display:'Sora',sans-serif;
    --font-body:'Work Sans',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    font-family:var(--font-body);
    font-weight:500;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  input::placeholder{ color:#B7BAC1; }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  a{ color:var(--accent); text-decoration:none; }
  a:hover{ color:var(--accent-dark); text-decoration:underline; }
  .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  table{ border-collapse:collapse; width:100%; }
  th,td{ padding:10px 12px; }
  button{ font-family:inherit; }
  select{ font-family:inherit; }
  ::selection{ background:var(--accent-tint); color:var(--ink); }
  @keyframes floatLine{ 0%{ stroke-dashoffset:600; } 100%{ stroke-dashoffset:0; } }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .fade-in{ animation:fadeIn .3s ease both; }
  .field-err{ font-size:12px; color:var(--red); margin:6px 0 0; display:none; }
  .invalid input{ border-color:var(--red) !important; }
  .invalid .field-err{ display:block; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); border:1px solid var(--ink); color:#FFFFFF; padding:11px 20px; border-radius:10px; font-size:13.5px;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:999;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .spin{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); border-top-color:#FFFFFF;
    animation:spin .7s linear infinite; display:inline-block; vertical-align:-2px; margin-right:8px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- ticker tape ---- */
  .ticker-wrap{ width:100%; background:var(--panel); border-bottom:1px solid var(--border); overflow:hidden; white-space:nowrap; }
  .ticker-track{ display:inline-flex; animation:scrollTicker 34s linear infinite; }
  @keyframes scrollTicker{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .tick{ font-family:var(--font-mono); font-size:11.5px; padding:7px 18px; display:inline-flex; gap:8px; align-items:center; color:var(--muted); border-right:1px solid var(--border); letter-spacing:0.2px; }
  .tick b{ color:var(--ink); font-weight:600; }
  @media (prefers-reduced-motion: reduce){ .ticker-track{ animation:none; } }

  /* ---- sidebar nav ---- */
  .nav-item:hover{ background:var(--panel-alt) !important; }

  /* ---- command palette ---- */
  .cmdk-overlay{
    position:fixed; inset:0; background:rgba(18,20,26,0.45); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding-top:12vh; z-index:500;
  }
  .cmdk-box{
    width:100%; max-width:480px; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; box-shadow:0 20px 50px rgba(18,20,26,0.18);
  }
  .cmdk-row{ padding:11px 16px; font-size:13.5px; color:var(--ink-soft); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .cmdk-row:hover, .cmdk-row.sel{ background:var(--panel-alt); color:var(--ink); }
  .cmdk-row .kbd{ font-family:var(--font-mono); font-size:10px; color:var(--muted); border:1px solid var(--border); padding:1px 5px; border-radius:4px; }

  /* ---- responsive layout primitives ---- */
  .sfc-shell{ display:flex; min-height:100vh; }
  .sfc-sidebar{ width:224px; flex:none; }
  .sfc-main{ flex:1; min-width:0; }
  .sfc-topbar{ display:flex; align-items:center; justify-content:space-between; padding:24px 36px 18px; flex-wrap:wrap; gap:12px; }
  .sfc-hamburger{ display:none; }
  .sfc-auth-grid{ display:grid; grid-template-columns:1fr 1fr; min-height:100vh; }
  .sfc-hero-pane{ min-height:280px; }
  .sfc-grid-4{ display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:14px; }
  .sfc-grid-5{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; }
  .sfc-grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .sfc-grid-2{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .sfc-side-content{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
  .sfc-two-col-blog{ display:grid; grid-template-columns:1fr 320px; gap:24px; align-items:start; }
  .sfc-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; }
  .sfc-table-wrap table{ width:auto !important; }
  .sfc-table-wrap td, .sfc-table-wrap th{ white-space:nowrap; }
  .sfc-table-wrap td.sfc-wrap-ok, .sfc-table-wrap th.sfc-wrap-ok{ white-space:normal; }
  .sfc-sidebar-backdrop{ display:none; }

  @media (max-width: 880px){
    .sfc-shell{ display:block !important; }
    .sfc-sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:400; width:264px !important;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 0 rgba(0,0,0,0);
    }
    .sfc-sidebar.open{ transform:translateX(0); box-shadow:20px 0 40px rgba(18,20,26,0.18); }
    .sfc-sidebar-backdrop.open{ display:block; position:fixed; inset:0; background:rgba(18,20,26,0.4); z-index:390; }
    .sfc-hamburger{ display:flex; }
    .sfc-topbar{ padding:16px 18px 14px; }
    .sfc-topbar h1{ font-size:18px !important; }
    .sfc-jump-label{ display:none; }
    .sfc-auth-grid{ grid-template-columns:1fr !important; }
    .sfc-hero-pane{ padding:36px 24px !important; min-height:auto !important; }
    .sfc-hero-pane h1{ font-size:28px !important; }
    .sfc-grid-4, .sfc-grid-5{ grid-template-columns:repeat(2,1fr) !important; }
    .sfc-grid-3{ grid-template-columns:1fr 1fr !important; }
    .sfc-side-content{ grid-template-columns:1fr !important; }
    .sfc-two-col-blog{ grid-template-columns:1fr !important; }
    .sfc-page-pad{ padding-left:18px !important; padding-right:18px !important; }
  }
  @media (max-width: 520px){
    .sfc-grid-4, .sfc-grid-5, .sfc-grid-3, .sfc-grid-2{ grid-template-columns:1fr !important; }
    .cmdk-overlay{ padding-top:8vh; padding-left:12px; padding-right:12px; }
  }
  /* ---- public marketing pages ---- */
  .pub-card-hover{ transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; cursor:pointer; }
  .pub-card-hover:hover{ transform:translateY(-4px); box-shadow:0 20px 44px -18px rgba(20,50,15,0.24); border-color:var(--accent); }
  .pub-feat:hover .pub-arrow{ transform:translateX(4px); }
  .pub-arrow{ transition:transform .16s ease; }
  .pub-nav{ transition:background .14s ease, color .14s ease; }
  .pub-nav:hover{ background:var(--panel-alt); color:var(--ink); }
  @media (max-width: 880px){ .pub-split{ grid-template-columns:1fr !important; } }

  /* JS-driven fallback (works even if the host page strips @media support) */
  #app.mobile .sfc-page-pad{ padding-left:18px !important; padding-right:18px !important; }
  #app.mobile .sfc-hamburger{ display:flex !important; }
</style>
</head>

// Deterministic 60-session synthetic EOD history (seeded, so it's stable across re-renders)
function seededRandom(seed){ return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }
function buildEodSeries(startPrice, seed){
  const rnd = seededRandom(seed);
  let close = startPrice;
  const rows = [];
  const today = new Date(2026, 6, 19);
  for(let i = 60; i >= 0; i--){
    const date = new Date(today); date.setDate(date.getDate() - i);
    if(date.getDay() === 0 || date.getDay() === 6) continue;
    const drift = (rnd() - 0.5) * startPrice * 0.014;
    const open = close;
    close = Math.max(startPrice * 0.85, open + drift);
    const high = Math.max(open, close) + rnd() * startPrice * 0.004;
    const low = Math.min(open, close) - rnd() * startPrice * 0.004;
    const vol = Math.round(1.2e6 + rnd() * 2.4e6);
    const oi = Math.round(4.5e6 + rnd() * 3.2e6);
    rows.push({ date: date.toISOString().slice(0,10), open, high, low, close, vol, oi });
  }
  return rows;
}

/* ============================= HELPERS ============================= */
function fmt(n){ return n.toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
function fmtInt(n){ return Math.round(n).toLocaleString('en-IN'); }
function signed(n, suffix){ return (n >= 0 ? '+' : '') + n.toFixed(2) + (suffix || ''); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function buildRows(d){
  const cols = ['strike','ceOI','ceChgOI','ceVol','ceIV','ceLTP','ceChg','peOI','peChgOI','peVol','peIV','peLTP','peChg'];
  const raw = d.rows.map(r => { const o = {}; cols.forEach((c,i) => o[c] = r[i]); return o; });
  const maxOI = Math.max(...raw.map(r => Math.max(r.ceOI, r.peOI)));
  const allIV = raw.flatMap(r => [r.ceIV, r.peIV]);
  const minIV = Math.min(...allIV), maxIV = Math.max(...allIV);
  const chartW = 560, chartH = 200, padTop = 14, padBot = 4;
  const n = raw.length;
  const ivY = v => padTop + (1 - (v - minIV) / (maxIV - minIV)) * (chartH - padTop - padBot);
  const cx = i => ((i + 0.5) / n * chartW).toFixed(1);

  return raw.map((r, i) => {
    const isAtm = r.strike === d.atmStrike;
    return {
      raw: r,
      strike: fmtInt(r.strike),
      strikeShort: (r.strike / 100).toFixed(0) + '00',
      ceOI: fmtInt(r.ceOI * 1000),
      ceChgOI: signed(r.ceChgOI, 'K'),
      ceChgOIColor: r.ceChgOI >= 0 ? 'var(--teal)' : 'var(--red)',
      ceVol: fmtInt(r.ceVol * 1000),
      ceIV: r.ceIV.toFixed(1) + '%',
      ceLTP: fmt(r.ceLTP),
      ceChg: signed(r.ceChg, '%'),
      ceChgColor: r.ceChg >= 0 ? 'var(--teal)' : 'var(--red)',
      peOI: fmtInt(r.peOI * 1000),
      peChgOI: signed(r.peChgOI, 'K'),
      peChgOIColor: r.peChgOI >= 0 ? 'var(--teal)' : 'var(--red)',
      peVol: fmtInt(r.peVol * 1000),
      peIV: r.peIV.toFixed(1) + '%',
      peLTP: fmt(r.peLTP),
      peChg: signed(r.peChg, '%'),
      peChgColor: r.peChg >= 0 ? 'var(--teal)' : 'var(--red)',
      isAtm,
      ceBarPct: (r.ceOI / maxOI * 100).toFixed(1),
      peBarPct: (r.peOI / maxOI * 100).toFixed(1),
      cx: cx(i),
      ceCy: ivY(r.ceIV).toFixed(1),
      peCy: ivY(r.peIV).toFixed(1),
      ceDelta: blackScholes(d.spot, r.strike, 12, r.ceIV, 6.5, 'CE').delta.toFixed(3),
      peDelta: blackScholes(d.spot, r.strike, 12, r.peIV, 6.5, 'PE').delta.toFixed(3)
    };
  });
}

function buildPath(rows, key){
  return rows.map((r,i) => (i===0 ? 'M':'L') + r.cx + ',' + r[key]).join(' ');
}

/* ---- Black-Scholes helpers ---- */
function normPdf(x){ return Math.exp(-x*x/2) / Math.sqrt(2*Math.PI); }
function normCdf(x){
  // Abramowitz & Stegun approximation
  const b1=0.319381530, b2=-0.356563782, b3=1.781477937, b4=-1.821255978, b5=1.330274429, p=0.2316419;
  const t = 1 / (1 + p*Math.abs(x));
  const poly = b1*t + b2*t*t + b3*t**3 + b4*t**4 + b5*t**5;
  const cdf = 1 - normPdf(x)*poly;
  return x >= 0 ? cdf : 1 - cdf;
}
function blackScholes(S, K, days, ivPct, ratePct, type){
  const T = Math.max(days,0.1) / 365;
  const sigma = Math.max(ivPct,0.1) / 100;
  const r = ratePct / 100;
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*Math.sqrt(T));
  const d2 = d1 - sigma*Math.sqrt(T);
  const isCall = type === 'CE';
  const price = isCall
    ? S*normCdf(d1) - K*Math.exp(-r*T)*normCdf(d2)
    : K*Math.exp(-r*T)*normCdf(-d2) - S*normCdf(-d1);
  const delta = isCall ? normCdf(d1) : normCdf(d1) - 1;
  const gamma = normPdf(d1) / (S*sigma*Math.sqrt(T));
  const vega = S*normPdf(d1)*Math.sqrt(T) / 100;
  const theta = isCall
    ? (-S*normPdf(d1)*sigma/(2*Math.sqrt(T)) - r*K*Math.exp(-r*T)*normCdf(d2)) / 365
    : (-S*normPdf(d1)*sigma/(2*Math.sqrt(T)) + r*K*Math.exp(-r*T)*normCdf(-d2)) / 365;
  const rho = isCall
    ? K*T*Math.exp(-r*T)*normCdf(d2) / 100
    : -K*T*Math.exp(-r*T)*normCdf(-d2) / 100;
  return { price, delta, gamma, theta, vega, rho, d1, d2 };
}

function iconBadge(svgInner, opts){

  return `<div style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.3)}px;background:${bg};display:flex;align-items:center;justify-content:center;flex:none">

/* ---- auth handlers ---- */
function selectAuthView(v){ state.authView = v; state.loginErrors={email:false,password:false}; state.registerErrors={name:false,email:false,phone:false,password:false}; render(); }

function submitLogin(ev){
  ev.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errs = { email: email.length < 2, password: pass.length < 1 };
  state.loginErrors = errs;
  if(errs.email || errs.password){ render(); return; }

  state.loading = true; render();
  const guess = email.includes('@') ? email.split('@')[0] : email;
  state.userName = guess ? guess.charAt(0).toUpperCase() + guess.slice(1) : 'Trader';
  setTimeout(() => {
    state.loading = false;
    enterApp();
  }, 750);
}

function submitRegister(ev){
  ev.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPassword').value;
  const errs = {
    name: name.length < 2,
    email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email),
    phone: phone.length < 6,
    password: pass.length < 8
  };
  state.registerErrors = errs;
  if(Object.values(errs).some(Boolean)){ render(); return; }

  state.registerEmail = email;
  state.registerName = name;
  state.registerPhone = phone;
  state.userName = name.split(' ')[0];
  state.loading = true; render();
  setTimeout(() => {
    state.loading = false;
    state.authStep = 'otp';
    render();
  }, 700);
}

function backToForm(){ state.authStep = 'form'; state.otpError=''; render(); }

function verifyOtp(){
  if(state.emailOtp.length !== 6 || state.phoneOtp.length !== 6){
    state.otpError = 'Enter the full 6-digit code in both fields.';
    render();
    return;
  }
  state.otpError = '';
  state.loading = true; render();
  setTimeout(() => {
    state.loading = false;
    enterApp();
  }, 700);
}

function enterApp(){
  state.page = 'app';
  state.activeSection = 'home';
  render();
}

function pcrOf(sym){
  const d = datasets[sym];
  const ce = d.rows.reduce((s,r)=>s+r[1],0), pe = d.rows.reduce((s,r)=>s+r[7],0);
  return (pe/ce).toFixed(2);

function submitExitTrade(ev){
  ev.preventDefault();
  const idx = state.tradeExitIndex;
  const p = positions[idx];
  if(!p) return;
  const exitPrice = parseFloat(document.getElementById('exitPrice').value);
  const today = new Date().toISOString().slice(0,10);
  const entryDate = p.entryDate || today;
  const days = Math.max(1, Math.round((new Date(today) - new Date(entryDate)) / 86400000));
  const symLabel = p.sub && p.sub.includes('·') ? `${p.sym} ${p.sub.split('·')[0].trim()}` : p.sym;
  CLOSED_TRADES.unshift({ date: today, sym: symLabel, type: p.type, qty: p.qty, entry: p.avg, exit: isNaN(exitPrice) ? p.cmp : exitPrice, days });
  positions.splice(idx, 1);
  state.tradeExitIndex = null;
  render();
  showToast('Trade closed — moved to Closed Trades');
}

  const bodyRows = rows.map(r => `

function selectSymbol(sym){ state.symbol = sym; render(); }
function toggleChainGreeks(){ state.chainShowGreeks = !state.chainShowGreeks; render(); }

function downloadCsv(){
  const d = datasets[state.symbol];
  const header = 'Strike,CE_OI,CE_ChgOI,CE_Vol,CE_IV,CE_LTP,CE_Chg%,PE_OI,PE_ChgOI,PE_Vol,PE_IV,PE_LTP,PE_Chg%\n';
  const body = d.rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([header + body], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${state.symbol}_option_chain.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast(`${state.symbol} option chain exported`);
}

/* ============================= GREEKS CALCULATOR ============================= */
function renderGreeks(){
  const g = state.greeks;
  const r = blackScholes(g.spot, g.strike, g.days, g.iv, g.rate, g.type);

  const chartW = 560, chartH = 180;
  const lo = g.spot * 0.85, hi = g.spot * 1.15, N = 40;
  const curve = [];
  for(let i=0;i<=N;i++){
    const S = lo + (hi-lo)*(i/N);
    curve.push({ S, price: blackScholes(S, g.strike, g.days, g.iv, g.rate, g.type).price });
  }
  const maxP = Math.max(...curve.map(c=>c.price), 1);
  const path = curve.map((c,i) => `${i===0?'M':'L'}${(i/N*chartW).toFixed(1)},${(chartH - (c.price/maxP)*(chartH-16) - 8).toFixed(1)}`).join(' ');
  const spotIdx = Math.round((g.spot - lo) / (hi - lo) * N);
  const spotX = (spotIdx/N*chartW).toFixed(1);
  const spotY = (chartH - (curve[Math.max(0,Math.min(N,spotIdx))].price/maxP)*(chartH-16) - 8).toFixed(1);

  return `
  <div class="sfc-page-pad" style="padding:28px 36px 60px">
    ${pageHead('Greeks Calculator', 'Black–Scholes Greeks for a single NSE F&amp;O contract.')}
    <div class="sfc-side-content" style="display:grid;grid-template-columns:${gridCols('side')};gap:20px;align-items:start">
      <div style="${cardStyle}">
        <div style="display:flex;gap:4px;background:var(--panel-alt);border-radius:8px;padding:4px;margin-bottom:18px">
          <button onclick="setGreeks('symbol','NIFTY')" style="${g.symbol==='NIFTY'?activeTab():inactiveTab()}">NIFTY</button>
          <button onclick="setGreeks('symbol','BANKNIFTY')" style="${g.symbol==='BANKNIFTY'?activeTab():inactiveTab()}">BANKNIFTY</button>
        </div>
        <div style="display:flex;gap:4px;background:var(--panel-alt);border-radius:8px;padding:4px;margin-bottom:20px">
          <button onclick="setGreeks('type','CE')" style="${g.type==='CE'?activeTab():inactiveTab()}">Call (CE)</button>
          <button onclick="setGreeks('type','PE')" style="${g.type==='PE'?activeTab():inactiveTab()}">Put (PE)</button>
        </div>
        ${numField('Spot price','greeks','spot',g.spot,1)}
        ${numField('Strike price','greeks','strike',g.strike,50)}
        ${numField('Days to expiry','greeks','days',g.days,1)}
        ${numField('Implied volatility (%)','greeks','iv',g.iv,0.1)}
        ${numField('Risk-free rate (%)','greeks','rate',g.rate,0.1)}
      </div>
      <div>
        <div style="${cardStyle};margin-bottom:16px">
          <div style="font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px">Theoretical price</div>
          <div class="num" style="font-size:34px;font-weight:700;color:var(--ink)">₹${r.price.toFixed(2)}</div>
        </div>
        <div class="sfc-grid-3" style="display:grid;grid-template-columns:${gridCols('grid-3')};gap:14px;margin-bottom:16px">
          ${statTile('Delta', r.delta.toFixed(4))}
          ${statTile('Gamma', r.gamma.toFixed(5))}
          ${statTile('Theta (per day)', '₹' + r.theta.toFixed(2), 'var(--red)')}
          ${statTile('Vega (per 1% IV)', '₹' + r.vega.toFixed(2))}
          ${statTile('Rho (per 1% rate)', '₹' + r.rho.toFixed(2))}
          ${statTile('Moneyness', g.spot > g.strike ? (g.type==='CE'?'ITM':'OTM') : g.spot < g.strike ? (g.type==='CE'?'OTM':'ITM') : 'ATM')}
        </div>
        <div style="${cardStyle};margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px">Theoretical price vs. spot</div>
          <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="${chartH}" preserveAspectRatio="none">
            <line x1="0" y1="${chartH-1}" x2="${chartW}" y2="${chartH-1}" stroke="var(--border)" stroke-width="1"></line>
            <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5"></path>
            <circle cx="${spotX}" cy="${spotY}" r="5" fill="var(--accent)" stroke="#fff" stroke-width="2"></circle>
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);margin-top:6px" class="num">
            <span>${fmtInt(lo)}</span><span>Spot ${fmtInt(g.spot)}</span><span>${fmtInt(hi)}</span>
          </div>
        </div>
        <div style="${cardStyle};padding:0;overflow:hidden">
          <div class="sfc-table-wrap"><table style="min-width:280px">
            <tbody>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">Delta</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">${r.delta.toFixed(4)}</td></tr>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">Gamma</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">${r.gamma.toFixed(5)}</td></tr>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">Theta / day</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">₹${r.theta.toFixed(2)}</td></tr>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">Vega / 1% IV</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">₹${r.vega.toFixed(2)}</td></tr>
              <tr><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">Rho / 1% rate</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">₹${r.rho.toFixed(2)}</td></tr>
            </tbody>
          </table></div>
        </div>
        <p style="font-size:12px;color:var(--muted-2);line-height:1.6;margin:16px 0 0">Computed with the standard Black–Scholes model. Theta is shown as value decay per calendar day; Vega and Rho are shown per 1-point move in IV and the risk-free rate respectively.</p>
      </div>
    </div>
  </div>`;
}

/* ============================= PROBABILITY CALCULATOR ============================= */
function renderProbability(){
  const p = state.prob;
  const T = Math.max(p.days,0.1)/365;
  const sigma = Math.max(p.iv,0.1)/100;
  const d2 = (Math.log(p.spot/p.target) + (-sigma*sigma/2)*T) / (sigma*Math.sqrt(T));
  const probAbove = normCdf(d2);
  const probBelow = 1 - probAbove;
  const probTouch = Math.min(1, 2 * Math.min(probAbove, probBelow) + (p.target === p.spot ? 1 : 0));
  const expectedMove = p.spot * sigma * Math.sqrt(T);

  return `
  <div class="sfc-page-pad" style="padding:28px 36px 60px">
    ${pageHead('Probability Calculator', 'Lognormal probability of an underlying finishing above / below a target price by expiry.')}
    <div class="sfc-side-content" style="display:grid;grid-template-columns:${gridCols('side')};gap:20px;align-items:start">
      <div style="${cardStyle}">
        <div style="display:flex;gap:4px;background:var(--panel-alt);border-radius:8px;padding:4px;margin-bottom:18px">
          <button onclick="setProb('symbol','NIFTY')" style="${p.symbol==='NIFTY'?activeTab():inactiveTab()}">NIFTY</button>
          <button onclick="setProb('symbol','BANKNIFTY')" style="${p.symbol==='BANKNIFTY'?activeTab():inactiveTab()}">BANKNIFTY</button>
        </div>
        ${numField('Spot price','prob','spot',p.spot,1)}
        ${numField('Target price','prob','target',p.target,50)}
        ${numField('Days to expiry','prob','days',p.days,1)}
        ${numField('Implied volatility (%)','prob','iv',p.iv,0.1)}
      </div>
      <div>
        <div class="sfc-grid-2" style="display:grid;grid-template-columns:${gridCols('grid-2')};gap:14px;margin-bottom:14px">
          ${statTile(`Probability of finishing above ${fmtInt(p.target)}`, (probAbove*100).toFixed(1)+'%', 'var(--teal)')}
          ${statTile(`Probability of finishing below ${fmtInt(p.target)}`, (probBelow*100).toFixed(1)+'%', 'var(--red)')}
        </div>
        <div class="sfc-grid-2" style="display:grid;grid-template-columns:${gridCols('grid-2')};gap:14px">
          ${statTile('Probability of touching target before expiry (approx.)', (probTouch*100).toFixed(1)+'%')}
          ${statTile('Expected 1-SD move by expiry', '±' + fmtInt(expectedMove))}
        </div>
        <div style="${cardStyle};margin-top:16px;margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px">1-SD expected range at expiry</div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono)">
            <span style="color:var(--red);font-weight:600">${fmtInt(p.spot-expectedMove)}</span>
            <div style="flex:1;height:6px;background:var(--panel-alt);border-radius:4px;margin:0 14px;position:relative">
              <div style="position:absolute;left:50%;top:-3px;width:2px;height:12px;background:var(--ink)"></div>
            </div>
            <span style="color:var(--teal);font-weight:600">${fmtInt(p.spot+expectedMove)}</span>
          </div>
        </div>
        ${(() => {
          const chartW = 560, chartH = 170;
          const lo = p.spot - 3.2*expectedMove, hi = p.spot + 3.2*expectedMove;
          const N = 60;
          const pts = [];
          for(let i=0;i<=N;i++){
            const S = lo + (hi-lo)*(i/N);
            const z = (Math.log(S/p.spot) + sigma*sigma/2*T) / (sigma*Math.sqrt(T));
            pts.push({ S, dens: normPdf(z) });
          }
          const maxD = Math.max(...pts.map(pt=>pt.dens),0.0001);
          const xOf = i => (i/N)*chartW;
          const yOf = dens => chartH - (dens/maxD)*(chartH-16) - 8;
          const path = pts.map((pt,i) => `${i===0?'M':'L'}${xOf(i).toFixed(1)},${yOf(pt.dens).toFixed(1)}`).join(' ');
          const targetX = ((p.target-lo)/(hi-lo)*chartW).toFixed(1);
          return `
        <div style="${cardStyle};margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px">Probability distribution at expiry</div>
          <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="${chartH}" preserveAspectRatio="none">
            <line x1="0" y1="${chartH-1}" x2="${chartW}" y2="${chartH-1}" stroke="var(--border)" stroke-width="1"></line>
            <path d="${path}" fill="rgba(127,167,106,0.12)" stroke="var(--accent)" stroke-width="2"></path>
            <line x1="${targetX}" y1="8" x2="${targetX}" y2="${chartH-1}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4,3"></line>
          </svg>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);margin-top:6px" class="num">
            <span>${fmtInt(lo)}</span><span style="color:var(--red)">Target ${fmtInt(p.target)}</span><span>${fmtInt(hi)}</span>
          </div>
        </div>`;
        })()}
        <div style="${cardStyle};padding:0;overflow:hidden">
          <div class="sfc-table-wrap"><table style="min-width:320px">
            <tbody>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">P(above ${fmtInt(p.target)})</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600;color:var(--teal)">${(probAbove*100).toFixed(1)}%</td></tr>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">P(below ${fmtInt(p.target)})</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600;color:var(--red)">${(probBelow*100).toFixed(1)}%</td></tr>
              <tr style="border-bottom:1px solid var(--border)"><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">P(touch before expiry)</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">${(probTouch*100).toFixed(1)}%</td></tr>
              <tr><td style="padding:9px 16px;font-size:12.5px;color:var(--muted)">Expected 1-SD move</td><td class="num" style="padding:9px 16px;text-align:right;font-weight:600">±${fmtInt(expectedMove)}</td></tr>
            </tbody>
          </table></div>
        </div>
        <p style="font-size:12px;color:var(--muted-2);line-height:1.6;margin:16px 0 0">Assumes lognormal price movement with constant volatility (no drift). Touch probability uses the common reflection-principle approximation, capped at 100%.</p>
      </div>
    </div>
  </div>`;
}

/* ============================= VOLATILITY (HV / IV) ============================= */
function renderHv(){
  const symbol = state.hv.symbol;
  const series = EOD_DATA[symbol];
  const closes = series.map(r => r.close);
  const dailyLogReturns = closes.slice(1).map((c,i) => Math.log(c/closes[i]));
  function hv(nDays, endIdx){
    const slice = dailyLogReturns.slice(Math.max(0,endIdx-nDays), endIdx);
    if(slice.length < 2) return null;
    const mean = slice.reduce((a,b)=>a+b,0)/slice.length;
    const variance = slice.reduce((a,b)=>a+(b-mean)**2,0)/(slice.length-1);
    return Math.sqrt(variance) * Math.sqrt(252) * 100;
  }
  const hv10 = hv(10, dailyLogReturns.length), hv20 = hv(20, dailyLogReturns.length), hv30 = hv(30, dailyLogReturns.length);
  const isIndex = CHAIN_SYMBOLS.includes(symbol);
  let atmIv = null;
  if(isIndex){
    const d = datasets[symbol];
    const rows = buildRows(d);
    const atm = rows.find(r => r.isAtm) || rows[Math.floor(rows.length/2)];
    atmIv = (parseFloat(atm.ceIV) + parseFloat(atm.peIV)) / 2;
  }

  const chartW = 720, chartH = 300;
  const marginLeft = 58, marginRight = 12, marginTop = 16, marginBottom = 30;
  const plotW = chartW - marginLeft - marginRight;
  const plotH = chartH - marginTop - marginBottom;
  const recent = closes.slice(-30);
  const recentDates = series.slice(-30).map(r => r.date);
  const min = Math.min(...recent), max = Math.max(...recent);
  const xOf = i => marginLeft + (recent.length > 1 ? (i/(recent.length-1)) : 0) * plotW;
  const yOf = price => marginTop + (1 - (price-min)/((max-min)||1)) * plotH;
  const pathPts = recent.map((c,i) => `${i===0?'M':'L'}${xOf(i).toFixed(1)},${yOf(c).toFixed(1)}`).join(' ');
  const yTicks = [0,1,2,3,4].map(k => ({ y: yOf(min + (max-min)*(k/4)), price: min + (max-min)*(k/4) })).reverse();
  const tickCount = Math.min(6, recent.length);
  const xTickIdx = Array.from(new Set(Array.from({length:tickCount}, (_,k) => Math.round(k*(recent.length-1)/((tickCount-1)||1)))));
  const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short' });

  const tableRows = series.slice(-15).map((r,i,arr) => {
    const idx = series.length - 15 + i;
    const h10 = hv(10, idx), h20 = hv(20, idx);
    const dailyChg = idx > 0 ? (r.close - series[idx-1].close) / series[idx-1].close * 100 : 0;
    return `<tr style="border-bottom:1px solid var(--border)">
      <td class="num" style="padding:9px 16px;font-weight:600">${r.date}</td>

      <td class="num" style="padding:9px 16px;text-align:right;color:${dailyChg>=0?'var(--teal)':'var(--red)'}">${signed(dailyChg,'%')}</td>
      <td class="num" style="padding:9px 16px;text-align:right">${h10?h10.toFixed(1)+'%':'—'}</td>
      <td class="num" style="padding:9px 16px;text-align:right">${h20?h20.toFixed(1)+'%':'—'}</td>
    </tr>`;
  }).join('');

  return `
  <div class="sfc-page-pad" style="padding:28px 36px 60px">
    ${pageHead('Historical Volatility', 'Realised (historical) volatility computed from daily EOD closes for any scrip.')}
    <div style="display:flex;gap:4px;background:var(--panel-alt);border-radius:8px;padding:4px;margin-bottom:20px;width:fit-content;flex-wrap:wrap">
      ${HV_SYMBOLS.map(sym => `<button onclick="setHvSymbol('${sym}')" style="${symbol===sym?activeTab():inactiveTab()}">${sym}</button>`).join('')}
    </div>
    <div class="sfc-grid-3" style="display:grid;grid-template-columns:${gridCols('grid-3')};gap:14px;margin-bottom:20px">
      ${statTile('10-day HV', hv10?hv10.toFixed(1)+'%':'—')}
      ${statTile('20-day HV', hv20?hv20.toFixed(1)+'%':'—')}
      ${statTile('30-day HV', hv30?hv30.toFixed(1)+'%':'—')}
    </div>
    ${isIndex ? `<div style="margin-bottom:20px">${statTile('Current ATM IV (for comparison)', atmIv.toFixed(1)+'%', atmIv > hv20 ? 'var(--red)' : 'var(--teal)')}</div>` : ''}
    <div style="${cardStyle};margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <div style="font-size:13.5px;font-weight:700;color:var(--ink)">${symbol} — last 30 sessions (close)</div>
        <div style="font-size:11px;color:var(--muted-2)"><span style="display:inline-block;width:9px;height:2px;background:var(--accent);vertical-align:middle;margin-right:5px"></span>Price (₹)</div>
      </div>
      <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="${chartH}" preserveAspectRatio="xMidYMid meet">
        ${yTicks.map(t => `
          <line x1="${marginLeft}" y1="${t.y.toFixed(1)}" x2="${chartW-marginRight}" y2="${t.y.toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>
          <text x="${marginLeft-8}" y="${(t.y+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" font-family="var(--font-mono)" fill="var(--muted)">${fmtInt(t.price)}</text>
        `).join('')}
        <path d="${pathPts}" fill="none" stroke="var(--accent)" stroke-width="2.5"></path>
        ${xTickIdx.map(i => `<text x="${xOf(i).toFixed(1)}" y="${chartH-8}" text-anchor="middle" font-size="10.5" font-family="var(--font-mono)" fill="var(--muted)">${fmtDate(recentDates[i])}</text>`).join('')}
        <text x="${(marginLeft+chartW-marginRight)/2}" y="${chartH-1}" text-anchor="middle" font-size="10" font-family="var(--font-body)" fill="var(--muted-2)" font-weight="600" style="text-transform:uppercase;letter-spacing:0.4px">Date</text>
      </svg>
    </div>
    <div style="${cardStyle};padding:0;overflow:hidden;margin-bottom:16px">
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:700;color:var(--ink)">Rolling HV — last 15 sessions</span>
        <button onclick="downloadHvCsv()" style="display:flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid var(--input-border);border-radius:8px;background:var(--panel);font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer">Download CSV</button>
      </div>
      <div class="sfc-table-wrap" style="max-height:440px;overflow-y:auto"><table style="min-width:480px">
        <thead><tr style="background:var(--head-bg);border-bottom:1px solid var(--border)">
          <th style="position:sticky;top:0;background:var(--head-bg);text-align:left;padding:9px 16px;font-size:11px;color:var(--muted-2);z-index:1">Date</th>

          <th style="position:sticky;top:0;background:var(--head-bg);text-align:right;padding:9px 16px;font-size:11px;color:var(--muted-2);z-index:1">HV-10</th>
          <th style="position:sticky;top:0;background:var(--head-bg);text-align:right;padding:9px 16px;font-size:11px;color:var(--muted-2);z-index:1">HV-20</th>

    <p style="font-size:12px;color:var(--muted-2);line-height:1.6;margin:0">IV richer than HV suggests options are pricing in more movement than has recently occurred — often seen ahead of events. IV below HV suggests options may be cheap relative to recent realised swings.</p>
  </div>`;
}

/* ============================= PAYOFF SIMULATOR ============================= */
function renderPayoff(){
  const legs = state.payoffLegs;
  const strikes = legs.map(l => l.strike);
  const lo = strikes.length ? Math.min(...strikes) * 0.94 : 24000;
  const hi = strikes.length ? Math.max(...strikes) * 1.06 : 25600;
  const N = 60;
  const points = [];
  for(let i=0;i<=N;i++){
    const S = lo + (hi-lo) * (i/N);
    let total = 0;
    legs.forEach(l => {
      const intrinsic = l.type === 'CE' ? Math.max(S - l.strike, 0) : Math.max(l.strike - S, 0);
      const perUnit = l.action === 'Buy' ? (intrinsic - l.premium) : (l.premium - intrinsic);
      total += perUnit * l.qty;
    });
    points.push({ S, total });
  }
  const maxProfit = Math.max(...points.map(p=>p.total));
  const maxLoss = Math.min(...points.map(p=>p.total));
  const breakevens = [];
  for(let i=1;i<points.length;i++){
    if((points[i-1].total < 0 && points[i].total >= 0) || (points[i-1].total > 0 && points[i].total <= 0)){
      const a=points[i-1], b=points[i];
      const frac = a.total === b.total ? 0 : -a.total/(b.total-a.total);
      breakevens.push(a.S + frac*(b.S-a.S));
    }
  }
  const chartW = 640, chartH = 220;
  const maxAbs = Math.max(Math.abs(maxProfit), Math.abs(maxLoss), 1);
  const yOf = v => chartH/2 - (v/maxAbs) * (chartH/2 - 12);
  const xOf = i => (i/N) * chartW;
  const path = points.map((p,i) => `${i===0?'M':'L'}${xOf(i).toFixed(1)},${yOf(p.total).toFixed(1)}`).join(' ');
  const zeroY = yOf(0);
  const areaPath = path + ` L${chartW},${zeroY} L0,${zeroY} Z`;

  const legRows = legs.map(l => `
    <tr style="border-bottom:1px solid var(--border)">
      <td class="num" style="padding:10px 14px;white-space:nowrap">${l.action} ${l.type} ${fmtInt(l.strike)}</td>
      <td class="num" style="padding:10px 14px;text-align:right;white-space:nowrap">₹${l.premium.toFixed(2)}</td>
      <td class="num" style="padding:10px 14px;text-align:right;white-space:nowrap">${l.qty}</td>
      <td style="padding:10px 14px;text-align:right;white-space:nowrap"><button onclick="removeLeg(${l.id})" style="border:none;background:none;color:var(--red);cursor:pointer;font-size:12px">Remove</button></td>
    </tr>`).join('');

  return `
  <div class="sfc-page-pad" style="padding:28px 36px 60px">
    ${pageHead('Payoff Simulator', 'Combined expiry payoff across all legs in your strategy.')}
    <div class="sfc-side-content" style="display:grid;grid-template-columns:${gridCols('side')};gap:20px;align-items:start">
      <div>
        <div style="${cardStyle};margin-bottom:16px">
          <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:14px">Add a leg</div>
          <form onsubmit="addLeg(event)">
            <div style="display:flex;gap:4px;background:var(--panel-alt);border-radius:8px;padding:4px;margin-bottom:12px">
              <button type="button" onclick="window._legType='CE';render()" style="${(window._legType||'CE')==='CE'?activeTab():inactiveTab()}">CE</button>
              <button type="button" onclick="window._legType='PE';render()" style="${(window._legType||'CE')==='PE'?activeTab():inactiveTab()}">PE</button>
            </div>
            <div style="display:flex;gap:4px;background:var(--panel-alt);border-radius:8px;padding:4px;margin-bottom:14px">
              <button type="button" onclick="window._legAction='Buy';render()" style="${(window._legAction||'Buy')==='Buy'?activeTab():inactiveTab()}">Buy</button>
              <button type="button" onclick="window._legAction='Sell';render()" style="${(window._legAction||'Buy')==='Sell'?activeTab():inactiveTab()}">Sell</button>
            </div>
            <label style="${labelStyle}">Strike</label>
            <input id="legStrike" type="number" step="50" value="24800" style="${miniInputStyle};margin-bottom:12px">
            <label style="${labelStyle}">Premium</label>

/* ============================= EOD DATABASE ============================= */
function expiryDateFromLabel(label){
  if(label.startsWith('31 Jul')) return new Date(2026,6,31);
  if(label.startsWith('07 Aug')) return new Date(2026,7,7);
  return new Date(2026,7,28);
}
function buildContractEod(symbol, type, strike, expiryLabel){
  const expiryDate = expiryDateFromLabel(expiryLabel);
  const chainRow = datasets[symbol].rows.find(r => r[0] === strike) || datasets[symbol].rows[Math.floor(datasets[symbol].rows.length/2)];
  const ivBase = type === 'CE' ? chainRow[4] : chainRow[10];
  const series = EOD_DATA[symbol];
  const rnd = seededRandom(Math.round(strike) + (type==='CE'?1:2) + symbol.length);
  return series.map(r => {
    const daysToExpiry = (expiryDate - new Date(r.date + 'T00:00:00')) / 86400000;
    if(daysToExpiry <= 0.3) return null;
    const bs = blackScholes(r.close, strike, daysToExpiry, ivBase, 6.5, type);
    const ltp = Math.max(0.05, bs.price);
    const wiggle = 1 + (rnd()-0.5)*0.06;
    const open = ltp*wiggle;
    const high = Math.max(open,ltp)*(1+rnd()*0.02);
    const low = Math.min(open,ltp)*(1-rnd()*0.02);
    const vol = Math.round(20000 + rnd()*80000);
    const oi = Math.round(50000 + rnd()*150000);
    return { date:r.date, open, high, low, close:ltp, vol, oi };
  }).filter(Boolean);
}

function downloadEodCsv(){
  const e = state.eod;
  const isOption = e.instrument === 'CE' || e.instrument === 'PE';
  const fullSeries = isOption ? buildContractEod(e.symbol, e.instrument, e.strike, e.expiry) : EOD_DATA[e.symbol];
  const rangeDays = { '1W':5, '1M':22, '3M':60 }[e.range];
  const rows = fullSeries.slice(-Math.min(rangeDays, fullSeries.length));
  const closeLabel = isOption ? 'LTP' : 'Close';
  const header = `Date,Open,High,Low,${closeLabel},Volume,OI\n`;
  const body = rows.map(r => [r.date,r.open.toFixed(2),r.high.toFixed(2),r.low.toFixed(2),r.close.toFixed(2),Math.round(r.vol),Math.round(r.oi)].join(',')).join('\n');
  const label = isOption ? `${e.symbol}_${fmtInt(e.strike)}${e.instrument}_${e.range}` : `${e.symbol}_FUT_${e.range}`;
  triggerDownload(`${label}_EOD.csv`, header+body, 'text/csv');
  showToast(`${e.symbol} EOD data exported`);
}
function triggerDownload(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

      <td class="num" style="padding:11px 16px;text-align:right">${t.exit.toFixed(2)}</td>
      <td class="num" style="padding:11px 16px;text-align:right">${t.days}d</td>
      <td class="num" style="padding:11px 16px;text-align:right;color:${color};font-weight:600">${pnlStr}</td>
    </tr>`;
  }).join('');

  return `
  <div class="sfc-page-pad" style="padding:28px 36px 60px">
    ${pageHead('Closed Trades', 'Realised profit and loss across settled positions.')}
    <div class="sfc-grid-3" style="display:grid;grid-template-columns:${gridCols('grid-3')};gap:14px;margin-bottom:20px">
      ${statTile('Realised P&L', (totalPnl>=0?'+':'−')+'₹'+Math.abs(Math.round(totalPnl)).toLocaleString('en-IN'), totalPnl>=0?'var(--teal)':'var(--red)')}
      ${statTile('Win rate', winRate+'%')}
      ${statTile('Avg. holding period', avgHold+' days')}
    </div>
    <div style="${cardStyle};padding:0;overflow:hidden">
      <div class="sfc-table-wrap"><table style="min-width:640px">
        <thead><tr style="background:var(--head-bg);border-bottom:1px solid var(--border)">
          <th style="text-align:left;padding:10px 16px;font-size:11px;color:var(--muted-2)">Closed on</th>
          <th style="text-align:left;padding:10px 16px;font-size:11px;color:var(--muted-2)">Instrument</th>
          <th style="text-align:right;padding:10px 16px;font-size:11px;color:var(--muted-2)">Qty</th>
          <th style="text-align:right;padding:10px 16px;font-size:11px;color:var(--muted-2)">Entry</th>
          <th style="text-align:right;padding:10px 16px;font-size:11px;color:var(--muted-2)">Exit</th>
          <th style="text-align:right;padding:10px 16px;font-size:11px;color:var(--muted-2)">Held</th>
          <th style="text-align:right;padding:10px 16px;font-size:11px;color:var(--muted-2)">P&amp;L</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
  </div>`;
}

/* ============================= COMING SOON ============================= */
function renderComingSoon(){
  const item = NAV_ITEMS.find(n => n.key === state.activeSection);
  return `
  <div style="padding:80px 36px;display:flex;justify-content:center">
    <div style="max-width:380px;text-align:center">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--teal-tint);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </div>
      <h2 style="font-size:19px;font-weight:700;color:var(--ink);margin:0 0 8px">${esc(item.label)} is on the way</h2>
      <p style="font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 22px">This module is still being built. Portfolio and Options Chain are fully wired up in this prototype — the rest are next in the release plan.</p>
      <button onclick="showToast('We will notify you when this ships')" style="padding:11px 22px;border:1.5px solid var(--input-border);border-radius:8px;background:var(--panel);font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer">Notify me</button>
    </div>
  </div>`;
}

/* ============================= INIT ============================= */
render();
</script>
</body>
